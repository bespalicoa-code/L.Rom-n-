<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA Tech | Premium Electronics Store</title>
    
    <!-- Google Fonts: Inter & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Paletă de culori Premium Dark */
            --bg-deep: #0f172a;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --white: #ffffff;
            --glass: rgba(30, 41, 59, 0.7);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- CUSTOM SCROLLBAR --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--bg-card); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: var(--transition);
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            letter-spacing: -1px;
        }

        .logo span { color: var(--accent); }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            background: var(--bg-deep);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border-radius: 12px;
            color: white;
            width: 250px;
            transition: var(--transition);
        }

        .search-box input:focus {
            width: 350px;
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
        }

        .cart-trigger {
            position: relative;
            cursor: pointer;
            font-size: 1.4rem;
            transition: var(--transition);
        }

        .cart-trigger:hover { color: var(--accent); }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--accent);
            color: var(--bg-deep);
            font-size: 0.7rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            margin-top: 80px;
        }

        .hero h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 2rem;
        }

        /* --- CATEGORIES --- */
        .categories {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .cat-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.7rem 1.5rem;
            border-radius: 100px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent);
            color: var(--bg-deep);
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        /* --- CATALOG GRID --- */
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2.5rem;
            padding: 0 5% 5rem;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: 24px;
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-12px);
            box-shadow: var(--shadow);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .product-img-wrapper {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .product-card:hover img {
            transform: scale(1.1);
        }

        .product-details {
            padding: 1.5rem;
        }

        .product-details h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--white);
        }

        .product-details p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            height: 40px;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .btn-add {
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }

        .btn-add:hover {
            background: var(--white);
            transform: rotate(90deg);
        }

        /* --- CART DRAWER --- */
        .cart-drawer {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100%;
            background: var(--bg-card);
            z-index: 2000;
            transition: var(--transition);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        .cart-drawer.open { right: 0; }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
        }

        .close-cart {
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1.5rem;
            background: var(--bg-deep);
            padding: 1rem;
            border-radius: 15px;
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
        }

        .cart-item-info h4 { font-size: 0.9rem; margin-bottom: 0.2rem; }
        .cart-item-info p { color: var(--accent); font-weight: 600; font-size: 0.8rem; }

        .cart-footer {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 1.5rem;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .checkout-btn:hover { background: var(--white); color: var(--bg-deep); }

        /* --- MODAL --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .modal-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 800px;
            border-radius: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            position: relative;
            animation: modalAnim 0.4s ease;
        }

        @keyframes modalAnim {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-img { width: 100%; height: 100%; object-fit: cover; }

        .modal-info { padding: 3rem; position: relative; }
        
        .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .modal-content { grid-template-columns: 1fr; max-height: 90vh; overflow-y: auto; }
            .modal-img { height: 300px; }
            .nav-actions .search-box input { width: 150px; }
            .nav-actions .search-box input:focus { width: 200px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">LUMINA<span>TECH</span></a>
        <div class="nav-actions">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Caută tehnologie...">
            </div>
            <div class="cart-trigger" id="cartTrigger">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </div>
        </div>
    </nav>

    <section class="hero">
        <h1>Viitorul începe aici.</h1>
        <p>Experimentați performanță fără precedent cu colecția noastră de dispozitive premium selectate pentru profesioniști.</p>
        <div class="categories" id="categoryFilters">
            <button class="cat-btn active" data-cat="all">Toate</button>
            <button class="cat-btn" data-cat="laptop">Laptopuri</button>
            <button class="cat-btn" data-cat="telefon">Telefoane</button>
            <button class="cat-btn" data-cat="audio">Audio</button>
            <button class="cat-btn" data-cat="gaming">Gaming</button>
        </div>
    </section>

    <main class="catalog" id="catalogGrid"></main>

    <!-- CART DRAWER -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>Coșul Tău</h2>
            <i class="fas fa-times close-cart" id="closeCart"></i>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Items generate via JS -->
        </div>
        <div class="cart-footer">
            <div class="total-box">
                <span>Total:</span>
                <span id="cartTotal">0 RON</span>
            </div>
            <button class="checkout-btn">Finalizează Comanda</button>
        </div>
    </div>

    <!-- PRODUCT MODAL -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <img src="" alt="" class="modal-img" id="modalImg">
            <div class="modal-info">
                <i class="fas fa-times close-modal" id="closeModal"></i>
                <span id="modalCat" style="color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 0.8rem;"></span>
                <h2 id="modalTitle" style="font-size: 2rem; margin: 0.5rem 0 1rem;"></h2>
                <p id="modalDesc" style="color: var(--text-muted); margin-bottom: 2rem; line-height: 1.6;"></p>
                <div class="card-footer" style="margin-bottom: 2rem;">
                    <span id="modalPrice" class="price"></span>
                    <button class="btn-add" id="modalAddBtn" style="width: auto; padding: 0 1.5rem; border-radius: 10px; font-size: 1rem; color: var(--bg-deep); font-weight: 700;">
                        Adaugă în Coș
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Baza de date extinsă
        const PRODUCTS = [
            { id: 1, title: "ZenBook Pro Duo", cat: "laptop", price: 8900, desc: "Dual screen, OLED 4K, Intel i9, 32GB RAM. Ideal pentru editare video.", image: "https://images.unsplash.com/photo-1541807084-6a4acc990573?auto=format&fit=crop&w=600" },
            { id: 2, title: "Pixel 7 Pro", cat: "telefon", price: 4200, desc: "Google AI Camera, 120Hz LTPO display, baterie 5000mAh.", image: "https://images.unsplash.com/photo-1678911820864-1974564669c2?auto=format&fit=crop&w=600" },
            { id: 3, title: "AirPods Max", cat: "audio", price: 2100, desc: "Active Noise Cancellation, Spatial Audio, design premium din aluminiu.", image: "https://images.unsplash.com/photo-1588423770574-91993ca0727a?auto=format&fit=crop&w=600" },
            { id: 4, title: "RTX 4090 GPU", cat: "gaming", price: 8500, desc: "Cea mai puternică placă video din lume, 24GB VRAM, DLSS 3.", image: "https://images.unsplash.com/photo-1591488376768-f9967663317d?auto=format&fit=crop&w=600" },
            { id: 5, title: "MacBook Air M2", cat: "laptop", price: 6100, desc: "Ultra-thin, silent design, bateria rezistă 18 ore, cip M2.", image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600" },
            { id: 6, title: "Samsung S23 Ultra", cat: "telefon", price: 5400, desc: "S Pen inclus, Zoom 100x, ecran Dynamic AMOLED 2X.", image: "https://images.unsplash.com/photo-1678911820864-1974564669c2?auto=format&fit=crop&w=600" },
            { id: 7, title: "Keychron K2", cat: "gaming", price: 600, desc: "Tastatură mecanică hot-swappable, RGB, compatibilă Mac/Win.", image: "https://images.unsplash.com/photo-1511467687858-23d96c377401?auto=format&fit=crop&w=600" },
            { id: 8, title: "Sony WH-1000XM5", cat: "audio", price: 1600, desc: "Liderul pieței în anularea zgomotului, autonomie 30h.", image: "https://images.unsplash.com/photo-1505740420928-5e5647149055?auto=format&fit=crop&w=600" },
        ];

        // Starea globală a aplicației
        let state = {
            cart: JSON.parse(localStorage.getItem('lumina_cart')) || [],
            filter: 'all',
            searchTerm: ''
        };

        // DOM Elements
        const grid = document.getElementById('catalogGrid');
        const cartDrawer = document.getElementById('cartDrawer');
        const modal = document.getElementById('productModal');

        // --- FUNCTII CORE ---

        function saveCart() {
            localStorage.setItem('lumina_cart', JSON.stringify(state.cart));
            updateCartUI();
        }

        function updateCartUI() {
            const itemsContainer = document.getElementById('cartItems');
            const countBadge = document.getElementById('cartCount');
            const totalDisplay = document.getElementById('cartTotal');
            
            itemsContainer.innerHTML = "";
            let total = 0;
            let count = 0;

            state.cart.forEach((item, index) => {
                total += item.price;
                count++;
                itemsContainer.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}">
                        <div class="cart-item-info">
                            <h4>${item.title}</h4>
                            <p>${item.price} RON</p>
                        </div>
                        <i class="fas fa-trash" style="margin-left:auto; cursor:pointer; color:#ff4d4d" onclick="removeFromCart(${index})"></i>
                    </div>
                `;
            });

            countBadge.innerText = count;
            totalDisplay.innerText = `${total} RON`;
        }

        function addToCart(id) {
            const product = PRODUCTS.find(p => p.id === id);
            state.cart.push(product);
            saveCart();
            
            // Feedback vizual
            const btn = document.querySelector('.btn-add');
            if(btn) {
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => btn.innerHTML = '<i class="fas fa-plus"></i>', 1000);
            }
        }

        window.removeFromCart = function(index) {
            state.cart.splice(index, 1);
            saveCart();
        }

        function renderCatalog() {
            grid.innerHTML = "";
            const filtered = PRODUCTS.filter(p => {
                const matchCat = state.filter === 'all' || p.cat === state.filter;
                const matchSearch = p.title.toLowerCase().includes(state.searchTerm.toLowerCase());
                return matchCat && matchSearch;
            });

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card" onclick="openModal(${p.id})">
                        <div class="product-img-wrapper">
                            <img src="${p.image}" alt="${p.title}">
                        </div>
                        <div class="product-details">
                            <h3>${p.title}</h3>
                            <p>${p.desc}</p>
                            <div class="card-footer">
                                <span class="price">${p.price} RON</span>
                                <button class="btn-add" onclick="event.stopPropagation(); addToCart(${p.id})">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // --- INTERACTIUNI UI ---

        window.openModal = function(id) {
            const p = PRODUCTS.find(prod => prod.id === id);
            document.getElementById('modalImg').src = p.image;
            document.getElementById('modalTitle').innerText = p.title;
            document.getElementById('modalDesc').innerText = p.desc;
            document.getElementById('modalPrice').innerText = `${p.price} RON`;
            document.getElementById('modalCat').innerText = p.cat;
            document.getElementById('modalAddBtn').onclick = () => addToCart(p.id);
            modal.style.display = 'flex';
        }

        // Event Listeners
        document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
        document.getElementById('cartTrigger').onclick = () => cartDrawer.classList.add('open');
        document.getElementById('closeCart').onclick = () => cartDrawer.classList.remove('open');
        
        document.getElementById('searchInput').oninput = (e) => {
            state.searchTerm = e.target.value;
            renderCatalog();
        };

        document.getElementById('categoryFilters').onclick = (e) => {
            if(e.target.classList.contains('cat-btn')) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                state.filter = e.target.dataset.cat;
                renderCatalog();
            }
        };

        // Init
        renderCatalog();
        updateCartUI();

    </script>
</body>
</html>
